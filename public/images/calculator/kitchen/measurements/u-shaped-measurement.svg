<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#fdf2f2" rx="10"/>
  <!-- Arm A (Left) -->
  <rect x="80" y="50" width="40" height="110" fill="#ecd4d4" stroke="#e0b8b8" stroke-width="1.5"/>
  <!-- Arm B (Bottom) -->
  <rect x="80" y="160" width="240" height="40" fill="#ecd4d4" stroke="#e0b8b8" stroke-width="1.5"/>
  <!-- Arm C (Right) -->
  <rect x="280" y="50" width="40" height="110" fill="#ecd4d4" stroke="#e0b8b8" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="92" y="115" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#334155">A</text>
  <text x="190" y="188" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#334155">B</text>
  <text x="292" y="115" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#334155">C</text>
</svg>
